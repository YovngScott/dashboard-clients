<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <style>
      /* Critical loading styles also serve AuthLoadingSkeleton after React mounts.
         Keep this shell independent of downloaded JS, fonts and application CSS. */
      html, body { margin: 0; background: #090d16; }
      .auth-loading-shell, .auth-loading-shell * { box-sizing: border-box; }
      .auth-skeleton-block { display:block; position:relative; overflow:hidden; background:#283244; border-radius:12px; }
      .auth-skeleton-block::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,#ffffff12,transparent); animation:auth-skeleton-sweep 1.6s linear infinite; }
      @keyframes auth-skeleton-sweep { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
      .auth-loading-shell { min-height:100dvh; padding:24px 32px; background:#090d16; }
      .auth-loading-shell .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      .auth-loading-header { height:60px; max-width:1460px; margin:auto; }
      .auth-loading-header > span { width:180px; height:28px; }
      .auth-loading-columns { display:grid; grid-template-columns:minmax(0,1.47fr) minmax(0,1fr); gap:32px; height:calc(100dvh - 108px); min-height:520px; max-width:1460px; margin:auto; }
      .auth-loading-art { border-radius:32px; }
      .auth-loading-form { padding:32px; border-radius:32px; background:#191f2e; }
      .auth-loading-tabs { height:52px; margin-bottom:32px; border-radius:28px; }
      .auth-loading-field { margin-bottom:28px; }
      .auth-loading-field > span { width:110px; height:12px; margin-bottom:12px; }
      .auth-loading-field > div { height:52px; }
      .auth-loading-noscript { padding:16px; color:#f4f6fb; font:16px/1.5 sans-serif; }
      @media (max-width:1023px) { .auth-loading-shell { padding:24px; } .auth-loading-columns { display:block; height:auto; min-height:0; } .auth-loading-art { display:none; } .auth-loading-form { padding:24px; max-width:480px; margin:auto; } }
      @media (prefers-reduced-motion:reduce) { .auth-skeleton-block::after { animation:none; } }
    </style>
    <link rel="preload" as="image" href="/stage-logo.png" />
    <link rel="icon" type="image/png" href="/stage-logo.png?v=2" />
    <title>Stage AI Labs — CEO Copilot y Automatización</title>
    <meta name="description" content="Un CEO Copilot que convierte conversaciones en trabajo resuelto. Conecta tus canales, consulta tus datos y actúa con las reglas de tu negocio." />
    <meta property="og:title" content="Stage AI Labs — CEO Copilot y Automatización" />
    <meta property="og:description" content="Un CEO Copilot que convierte conversaciones en trabajo resuelto. Conecta tus canales, consulta tus datos y actúa con las reglas de tu negocio." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script defer src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this with the same session-loading shell on first render. -->
      <main class="auth-loading-shell" role="status" aria-busy="true" aria-label="Cargando tu espacio">
        <p class="sr-only">Cargando tu espacio…</p>
        <div class="auth-loading-header" aria-hidden="true"><span class="auth-skeleton-block"></span></div>
        <div class="auth-loading-columns" aria-hidden="true">
          <div class="auth-loading-art auth-skeleton-block"></div>
          <div class="auth-loading-form">
            <div class="auth-skeleton-block auth-loading-tabs"></div>
            <div class="auth-loading-field"><span class="auth-skeleton-block"></span><div class="auth-skeleton-block"></div></div>
            <div class="auth-loading-field"><span class="auth-skeleton-block"></span><div class="auth-skeleton-block"></div></div>
            <div class="auth-loading-field"><span class="auth-skeleton-block"></span><div class="auth-skeleton-block"></div></div>
            <div class="auth-skeleton-block auth-loading-tabs"></div>
          </div>
        </div>
        <noscript><p class="auth-loading-noscript">Activa JavaScript para acceder a Stage AI Labs.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
