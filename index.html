<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172C43" />
    <title>Flujo — Automatiza tu comunidad</title>
    <meta name="description" content="Plataforma de automatización de conversaciones y comunidad para creadores y marcas." />
    <meta property="og:title" content="Flujo — Automatiza tu comunidad" />
    <meta property="og:description" content="Plataforma de automatización de conversaciones y comunidad para creadores y marcas." />
    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'system';
        var isDark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
